name: Verificação básica

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Verificar estrutura mínima
        run: npm run check

      - name: Validar módulo de risco
        run: |
          grep -q "riskHardLock" src/index.html
          grep -q "hardLock" src/js/app.js
          grep -q "hardBlockWarnings" src/js/app.js
          grep -q "riskSummaryBox" src/index.html
          grep -q "riskEvents" src/js/app.js
          grep -q "recordRiskEvent" src/js/app.js
          grep -q "Resumo Diário de Risco" src/index.html
